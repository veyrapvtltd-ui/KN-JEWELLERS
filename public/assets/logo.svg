<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082" />
      <stop offset="35%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#aa771c" />
      <stop offset="100%" stop-color="#ffd700" />
    </linearGradient>
    <linearGradient id="wineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9c152b" />
      <stop offset="100%" stop-color="#7b1122" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fffcf8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7b1122" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Outer Gold Circle Frame -->
  <circle cx="250" cy="250" r="230" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8" filter="url(#shadow)"/>
  <circle cx="250" cy="250" r="215" fill="none" stroke="url(#wineGrad)" stroke-width="2" stroke-dasharray="6,4"/>
  
  <!-- Crown / Diamond Top Crest -->
  <path d="M250 85 L275 125 L315 115 L290 155 L210 155 L185 115 L225 125 Z" fill="url(#goldGrad)" />
  <circle cx="250" cy="80" r="8" fill="url(#wineGrad)" />
  <circle cx="185" cy="110" r="5" fill="url(#goldGrad)" />
  <circle cx="315" cy="110" r="5" fill="url(#goldGrad)" />

  <!-- Monogram KN -->
  <text x="250" y="270" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="100" font-weight="bold" fill="url(#wineGrad)" text-anchor="middle" letter-spacing="4">KN</text>

  <!-- Divider Line -->
  <line x1="120" y1="300" x2="380" y2="300" stroke="url(#goldGrad)" stroke-width="3"/>
  <polygon points="250,295 258,300 250,305 242,300" fill="url(#goldGrad)"/>

  <!-- Subtitle Text -->
  <text x="250" y="340" font-family="'Cinzel', 'Montserrat', 'Arial', sans-serif" font-size="28" font-weight="bold" fill="#7b1122" text-anchor="middle" letter-spacing="6">KN</text>
  <text x="250" y="372" font-family="'Cinzel', 'Montserrat', 'Arial', sans-serif" font-size="18" font-weight="bold" fill="#d4af37" text-anchor="middle" letter-spacing="6">JEWELLERS</text>
  <text x="250" y="405" font-family="'Montserrat', 'Arial', sans-serif" font-size="11" font-weight="700" fill="#7b1122" text-anchor="middle" letter-spacing="4">AMBALA CANTT</text>
</svg>
